# ============ 站点基本信息 ============
baseURL: "https://yu-harness.github.io/blog/"
locale: "zh-cn"
defaultContentLanguage: "zh-cn"
title: "赵宇 · 大模型工程师"
theme: "PaperMod"

# 每页显示几篇文章
pagination:
  pagerSize: 10

# 数字花园的两个维度：
#   tags   —— 横向的话题（如 工具调用 / 上下文窗口）
#   series —— 纵向的系列弧（如 LLM 基础 01/02/03）
taxonomies:
  tag: tags
  series: series

# 首页模块卡片的顺序（同时也是承认的知识分区）
mainSections:
  - agent
  - rag
  - llm
  - production
  - backend
  - builds
  - notes

# 让搜索能用：首页额外生成一份 index.json，搜索页读它
outputs:
  home:
    - HTML
    - RSS
    - JSON

enableRobotsTXT: true
enableEmoji: true

# 数学公式：让 Hugo 把 $...$ 与 $$...$$ 原样保住，渲染交给 KaTeX
markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['$$', '$$'], ['\[', '\]']]
          inline: [['$', '$'], ['\(', '\)']]

  # 代码高亮：使用 class-based（Chroma）
  # 若不显式设为 false，Hugo 默认输出内联样式（Monokai 深绿底），
  # 会导致主题自带 chroma 样式与 assets/css/extended/station.css 的冷调配色全部失效。
  # 改为 class-based 后，由 station.css 提供「编辑器冷调」token 配色。
  highlight:
    noClasses: false

params:
  env: production
  description: "yu-harness 的 Agent Harness 工程笔记：Agent 架构、RAG 与记忆、生产级落地、后端基石。每篇尽量给出能复现的数字。"
  DateFormat: "2006/01/02"

  # 站点图标与浏览器主题色
  # 图标文件放在 static/ 下（favicon.ico / favicon-16x16.png / favicon-32x32.png /
  # apple-touch-icon.png / safari-pinned-tab.svg），路径用 head.html 里的默认值即可，
  # 这里只覆盖浏览器 UI 的取色，使其与「编辑器冷调」的深色底一致。
  assets:
    theme_color: "#0b0e14"
    msapplication_TileColor: "#0b0e14"

  # 深色打底
  defaultTheme: dark

  # 文章页显示哪些东西
  ShowReadingTime: false
  ShowWordCount: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false

  # 首页顶部（Hero 品牌区）
  hero:
    subtitle: "Models provide the intelligence; I build the Harness."
    tagline: "yu-harness ｜ Agent Harness Engineering · RAG · Memory · 生产级落地"
    epigraph: "核心理想：让 21 世纪不再有贫困——金钱退场，资源流动。"
    motto: "终极目标：带领人类逃离银河系。"

  # 首页的知识分区入口卡片（顺序即呈现顺序）
  # 增改 zones 时同步维护 content/ 下的目录与 menu.main
  garden_modules:
    - title: "Agent 架构"
      url: "/agent/"
      glyph: "🤖"
      desc: "执行模式、工具调用、MCP、多智能体编排与 Harness 运行时。"
    - title: "RAG & Memory"
      url: "/rag/"
      glyph: "🧠"
      desc: "检索管线、上下文工程、记忆系统。"
    - title: "LLM 基础"
      url: "/llm/"
      glyph: "📐"
      desc: "Transformer 与 token、对齐与幻觉、后训练。"
    - title: "生产级落地"
      url: "/production/"
      glyph: "⚙️"
      desc: "可观测性、评测、推理部署、延迟与成本。"
    - title: "后端基石"
      url: "/backend/"
      glyph: "🔥"
      desc: "Redis 高可用、并发与锁、存储选型。"
    - title: "笔记与备考"
      url: "/notes/"
      glyph: "📝"
      desc: "面试题、读书与论文笔记、个人观点。"

  # 精选项目（首页下半区）
  projects:
    - title: "Pico"
      url: "/builds/pico/pico-coding-agent-harness/"
      stack: "Agent Harness"
      desc: "本地代码智能体：单主循环、六段提示词预算裁剪、Prefix Cache 对齐、七工具受控执行链。"
    - title: "Medical Agent"
      url: "/builds/medical-agent/medical-skills-agent-architecture/"
      stack: "Router + Skills"
      desc: "两层架构：意图路由与槽位填充 + 声明式 Skill 状态机，混合检索与证据强制绑定。"
    - title: "RAG KB"
      url: "/builds/rag-kb/"
      stack: "FastAPI · Chroma"
      desc: "知识库问答系统：切分、检索链路与评测拆解。"

  # 侧边和底部的图标，有了账号再取消注释
  # socialIcons:
  #   - name: github
  #     url: "https://github.com/yu-harness"

