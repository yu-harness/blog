# ============ 站点基本信息 ============
baseURL: "https://yu-harness.github.io/blog/"
locale: "zh-cn"
defaultContentLanguage: "zh-cn"
title: "AI 学习笔记"
theme: "PaperMod"

# 每页显示几篇文章
pagination:
  pagerSize: 10

# 首页显示哪些栏目的文章（顺序就是显示顺序）
mainSections:
  - llm
  - rag
  - agent
  - engineering

# 让搜索能用：首页额外生成一份 index.json，搜索页读它
outputs:
  home:
    - HTML
    - RSS
    - JSON

enableRobotsTXT: true
enableEmoji: true

# 数学公式：让 Hugo 把 $...$ 与 $$...$$ 原样保住，渲染交给 KaTeX
markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['$$', '$$'], ['\[', '\]']]
          inline: [['$', '$'], ['\(', '\)']]

  # 代码高亮：使用 class-based（Chroma）
  # 若不显式设为 false，Hugo 默认输出内联样式（Monokai 深绿底），
  # 会导致主题自带 chroma 样式与 assets/css/extended/station.css 的冷调配色全部失效。
  # 改为 class-based 后，由 station.css 提供「编辑器冷调」token 配色。
  highlight:
    noClasses: false

params:
  env: production
  description: "大模型与 Agent 应用开发：什么条件下会坏、代价是多少、实测是多少"
  DateFormat: "2006/01/02"

  # 深色打底
  defaultTheme: dark

  # 文章页显示哪些东西
  ShowReadingTime: false
  ShowWordCount: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false

  # 首页顶部
  hero:
    subtitle: "大模型 · 检索 · Agent"
    tagline: "什么条件下会坏 · 代价是多少 · 我实测是多少"
    epigraph: "跑不出来的数字，不写。"
    motto: "向着光出发"

  # 侧边和底部的图标，有了账号再取消注释
  # socialIcons:
  #   - name: github
  #     url: "https://github.com/yu-harness"

menu:
  main:
    - identifier: llm
      name: 原理与边界
      url: /llm/
      weight: 10
    - identifier: rag
      name: 检索
      url: /rag/
      weight: 20
    - identifier: agent
      name: Agent
      url: /agent/
      weight: 30
    - identifier: engineering
      name: 实测与项目
      url: /engineering/
      weight: 40
    - identifier: about
      name: 关于
      url: /about/
      weight: 50
    - identifier: search
      name: 搜索
      url: /search/
      weight: 60
  footer:
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 10
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 20
