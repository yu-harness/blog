# ============ 站点基本信息 ============
baseURL: "https://yu-harness.github.io/blog/"
locale: "zh-cn"
defaultContentLanguage: "zh-cn"
title: "赵宇 · 大模型工程师"
theme: "PaperMod"

# 每页显示几篇文章
pagination:
  pagerSize: 10

# 首页显示哪些栏目的文章（顺序就是显示顺序）
mainSections:
  - llm
  - tools
  - notes

# 让搜索能用：首页额外生成一份 index.json，搜索页读它
outputs:
  home:
    - HTML
    - RSS
    - JSON

enableRobotsTXT: true
enableEmoji: true

# 数学公式：让 Hugo 把 $...$ 与 $$...$$ 原样保住，渲染交给 KaTeX
markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['$$', '$$'], ['\[', '\]']]
          inline: [['$', '$'], ['\(', '\)']]

  # 代码高亮：使用 class-based（Chroma）
  # 若不显式设为 false，Hugo 默认输出内联样式（Monokai 深绿底），
  # 会导致主题自带 chroma 样式与 assets/css/extended/station.css 的冷调配色全部失效。
  # 改为 class-based 后，由 station.css 提供「编辑器冷调」token 配色。
  highlight:
    noClasses: false

params:
  env: production
  description: "赵宇的大模型工程笔记：LLM 原理与边界、RAG、Agent 与工具链，每篇都有实测数字。"
  DateFormat: "2006/01/02"

  # 站点图标与浏览器主题色
  # 图标文件放在 static/ 下（favicon.ico / favicon-16x16.png / favicon-32x32.png /
  # apple-touch-icon.png / safari-pinned-tab.svg），路径用 head.html 里的默认值即可，
  # 这里只覆盖浏览器 UI 的取色，使其与「编辑器冷调」的深色底一致。
  assets:
    theme_color: "#0b0e14"
    msapplication_TileColor: "#0b0e14"

  # 深色打底
  defaultTheme: dark

  # 文章页显示哪些东西
  ShowReadingTime: false
  ShowWordCount: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false

  # 首页顶部
  hero:
    subtitle: "大模型工程师 ｜ LLM · RAG · Agent"
    tagline: "什么条件下会坏 · 代价是多少 · 我实测是多少"
    epigraph: "核心理想：让 21 世纪不再有贫困——金钱退场，资源流动。"
    motto: "终极目标：带领人类逃离银河系。"

  # 侧边和底部的图标，有了账号再取消注释
  # socialIcons:
  #   - name: github
  #     url: "https://github.com/yu-harness"

menu:
  main:
    - identifier: llm
      name: 大模型
      url: /llm/
      weight: 10
    - identifier: tools
      name: 工具链
      url: /tools/
      weight: 20
    - identifier: notes
      name: 观点与笔记
      url: /notes/
      weight: 30
    - identifier: about
      name: 关于
      url: /about/
      weight: 40
    - identifier: search
      name: 搜索
      url: /search/
      weight: 50
  footer:
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 10
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 20
