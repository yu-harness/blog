
{{- /* Mermaid 按需渲染：仅当正文出现 ```mermaid 代码块时才加载脚本。
       构建期检测 Content 里的 language-mermaid，命中才输出；运行期把 Chroma
       生成的 pre>code.language-mermaid 换成 div.mermaid 再 run()。
       配色直接取 station.css 的「编辑器冷调」变量。 */ -}}
{{- if and (eq .Kind "page") (strings.Contains .Content "language-mermaid") }}
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

  const cssRoot = getComputedStyle(document.documentElement);
  const pick = (name, fallback) => (cssRoot.getPropertyValue(name) || fallback).trim();

  mermaid.initialize({
    startOnLoad: false,
    securityLevel: "loose",
    theme: "base",
    flowchart: { curve: "basis", htmlLabels: true },
    themeVariables: {
      background: pick("--theme", "#0b0e14"),
      primaryColor: pick("--entry", "#11151d"),
      primaryTextColor: pick("--content", "#c0c8d4"),
      primaryBorderColor: pick("--tertiary", "#2a3241"),
      lineColor: pick("--secondary", "#737f91"),
      secondaryColor: pick("--entry", "#11151d"),
      tertiaryColor: pick("--code-block-bg", "#0f131a"),
      fontFamily: pick("--font-mono", "ui-monospace, monospace")
    }
  });

  document.querySelectorAll("pre > code.language-mermaid").forEach(function (code) {
    const pre = code.closest("pre");
    if (!pre) return;
    const box = document.createElement("div");
    box.className = "mermaid";
    box.textContent = code.textContent;
    pre.replaceWith(box);
  });

  mermaid.run({ querySelector: ".mermaid" });
</script>
{{- end }}
